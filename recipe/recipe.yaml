schema_version: 1

context:
  version: "7.4.2002"

package:
  name: murex
  version: ${{ version }}

source:
  url: https://github.com/lmorg/murex/archive/v${{ version }}.tar.gz
  sha256: b3b1b79d89e2ab74bd15f3632a1878a4c958e2a0db272852834095e57f8644e4

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - murex -v

about:
  license: GPL-2.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Bash-like shell designed for greater command-line productivity and safer scripts
  homepage: https://murex.rocks
  repository: https://github.com/lmorg/murex

extra:
  recipe-maintainers:
    - danielnachun
