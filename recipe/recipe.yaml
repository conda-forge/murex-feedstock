schema_version: 1

context:
  version: "7.3.1231"

package:
  name: murex
  version: ${{ version }}

source:
  url: https://github.com/lmorg/murex/archive/v${{ version }}.tar.gz
  sha256: 318a283faf9de54ef5caec711cb26a38bbd22f243f5940dceebc8c7b5f80c791

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - murex -v

about:
  license: GPL-2.0-only
  license_file:
    - LICENSE
    - license-files/
  summary: Bash-like shell designed for greater command-line productivity and safer scripts
  homepage: https://murex.rocks
  repository: https://github.com/lmorg/murex

extra:
  recipe-maintainers:
    - danielnachun
